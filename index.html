<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Nastaliq+Urdu:wght@400;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brick:#6e1717; --brick2:#8f1d1d; --red:#c8202a; --red-soft:#fdecea;
    --gold:#f6c933; --white:#ffffff; --bg:#fbf6f2; --ink:#2a1414; --muted:#7d6a66;
    --line:#efe2dc; --radius:14px; --maxw:760px;
  }
  *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Urdu Typesetting',serif}
  a{color:inherit}

  /* ---------- Header ---------- */
  header{color:#fff;padding:18px 18px 20px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(200,32,42,.55), transparent 60%),
      radial-gradient(90% 80% at 0% 100%, rgba(0,0,0,.35), transparent 60%),
      linear-gradient(160deg,var(--brick2),var(--brick));}
  .wrap{max-width:var(--maxw);margin:0 auto}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    color:#fff;font:700 .75rem 'Poppins',sans-serif;letter-spacing:.6px;text-transform:uppercase;padding:6px 10px;border-radius:999px}
  .badge b{color:var(--gold)}
  .badge .truck{width:1.35em;height:1.05em;flex-shrink:0}
  body.ur .badge .truck{transform:scaleX(-1);width:1.5em;height:1.15em;margin-top:6px}
  body.ur .badge{font-family:'Noto Nastaliq Urdu',serif;font-weight:400;text-transform:none;letter-spacing:0;padding:2px 12px 8px;font-size:.85rem}
  .lang{display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px;flex-shrink:0}
  .lang button{border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:999px;font:700 .85rem 'Poppins',sans-serif;cursor:pointer}
  .lang button[data-l="ur"]{font-family:'Noto Nastaliq Urdu',serif;font-weight:400;padding:3px 14px 9px}
  .lang button.on{background:#fff;color:var(--brick)}

  .logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin:14px 0 4px}
  .logo svg{width:120px;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
  .logo .ar{font-family:'Lalezar','Noto Naskh Arabic',serif;color:var(--gold);font-size:2.9rem;line-height:1.1;margin-top:2px;
    text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .logo .en{font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;letter-spacing:.5px;color:#fff;font-size:1.05rem;margin-top:2px}

  .call{display:flex;justify-content:center;gap:10px;margin:16px 0 0;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:700 .95rem 'Poppins',sans-serif;
    padding:11px 18px;border-radius:12px;direction:ltr}
  .btn svg{width:18px;height:18px}
  .btn.primary{background:var(--gold);color:var(--brick)}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}

  .search{margin-top:16px}
  .search input{width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:#fff;color:var(--ink);outline:none}
  body.ur .search input{padding:6px 14px 12px;line-height:2.2}

  /* ---------- Category tabs ---------- */
  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:var(--maxw);margin:0 auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex-shrink:0;text-decoration:none;color:var(--brick);background:#fff;border:1px solid var(--line);
    padding:5px 14px 5px 8px;border-radius:999px;font-weight:600;font-size:.9rem;white-space:nowrap}
  body.ur .tabs a{font-weight:400;padding:0 8px 6px 14px;line-height:2.1}
  .tabs a.on{background:var(--red);color:#fff;border-color:var(--red)}
  .tabs a{display:inline-flex;align-items:center;gap:6px}
  .tabs a .ti{width:26px;height:26px;object-fit:contain;flex-shrink:0}
  body.ur .tabs a .ti{margin-top:6px}
  .tabs a.on .ti{background:#fff;border-radius:50%;padding:2px}
  section h2 .hi{width:52px;height:52px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 3px rgba(110,23,23,.18))}
  body.ur section h2 .hi{margin-top:8px}

  /* ---------- Menu ---------- */
  main{max-width:var(--maxw);margin:0 auto;padding:4px 14px 10px}
  section{padding-top:20px}
  section h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:1.2rem;color:var(--brick)}
  section h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent);border-radius:2px;opacity:.5}
  body.ur section h2::after{background:linear-gradient(270deg,var(--red),transparent)}
  body.ur section h2{font-size:1.3rem;line-height:2.2;margin-bottom:4px}
  .list{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 2px rgba(110,23,23,.05)}
  .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .name{font-weight:600;font-size:1rem}
  .note{display:inline-block;margin-inline-start:6px;background:var(--red-soft);color:var(--red);font-weight:600;font-size:.72rem;
    padding:2px 7px;border-radius:6px;vertical-align:middle}
  body.ur .name{font-weight:400;font-size:1.08rem;line-height:2.1}
  body.ur .note{font-weight:400;font-size:.8rem;padding:0 7px 4px}
  .price{flex-shrink:0;background:var(--red);color:#fff;font:700 .95rem 'Poppins',sans-serif;padding:5px 11px;border-radius:9px;white-space:nowrap;direction:ltr}
  .empty{display:none;text-align:center;color:var(--muted);padding:40px 10px}

  /* ---------- Contact ---------- */
  .contact{max-width:var(--maxw);margin:26px auto 0;padding:0 14px}
  .card{background:linear-gradient(160deg,var(--brick2),var(--brick));color:#fff;border-radius:18px;padding:20px}
  .card h3{margin:0 0 12px;font-size:1.15rem;color:var(--gold)}
  body.ur .card h3{line-height:2.2}
  .row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.14);text-decoration:none}
  .row:first-of-type{border-top:0}
  .row svg{width:22px;height:22px;flex-shrink:0;margin-top:2px;color:var(--gold)}
  .row small{display:block;color:#f1cfc9;font-size:.78rem}
  .row span{font-weight:600}
  .row .ph{font-family:'Poppins',sans-serif;font-weight:600 !important;font-size:1.25rem;letter-spacing:.5px;direction:ltr;display:inline-block}
  body.ur .row span{font-weight:400;line-height:2.1}
  body.ur .row small{line-height:2}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:18px 16px 96px}
  body.ur footer{line-height:2.2;font-size:.88rem}

  /* ---------- Floating call button ---------- */
  .fab{position:fixed;bottom:16px;inset-inline-end:16px;z-index:10;display:flex;align-items:center;gap:8px;
    background:var(--red);color:#fff;text-decoration:none;font:700 .95rem 'Poppins',sans-serif;padding:13px 18px;border-radius:999px;
    box-shadow:0 6px 18px rgba(200,32,42,.45)}
  .fab svg{width:20px;height:20px}
  body.ur .fab span{font-family:'Noto Nastaliq Urdu',serif;font-weight:400;line-height:1.6;padding-bottom:4px}
  /* ---------- Focus (keyboard only, no ring after a tap/click) ---------- */
  button:focus{outline:none}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ---------- Tablet & desktop ---------- */
  @media (min-width:700px){
    :root{--maxw:980px}
    header{padding:22px 28px 26px}
    .logo svg{width:150px}
    .logo .ar{font-size:3.4rem}
    .search{max-width:620px;margin-left:auto;margin-right:auto}
    .tabs{flex-wrap:wrap;justify-content:center;overflow:visible;padding:10px 20px}
    main{padding:4px 20px 10px}
    .contact{padding:0 20px}
  }
  @media (min-width:900px){
    :root{--maxw:1140px}
    /* two columns of items inside each category */
    .list{display:grid;grid-template-columns:1fr 1fr}
    .item{border-top:1px solid var(--line)}
    .item:nth-child(-n+2){border-top:0}
    .item:nth-child(odd){border-inline-end:1px solid var(--line)}
    .contact .card{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;align-items:start}
    .contact .card h3{grid-column:1 / -1}
    .contact .row{border-top:0}
  }
</style>
</head>

const ico = (c, cls) => `<img class="${cls}" src="${ICONS[c.icon]}" alt="" width="64" height="64">`;

/* Font Awesome Free 'truck-fast' icon (CC BY 4.0, fontawesome.com) embedded so it works without loading anything */
const TRUCK = '<svg class="truck" viewBox="0 0 640 512" fill="rgb(255, 255, 255)" aria-hidden="true"><path d="M64 96c0-35.3 28.7-64 64-64h288c35.3 0 64 28.7 64 64v32h50.7c17 0 33.3 6.7 45.3 18.7l45.3 45.3c12 12 18.7 28.3 18.7 45.3V384c0 35.3-28.7 64-64 64h-3.3c-10.4 36.9-44.4 64-84.7 64s-74.2-27.1-84.7-64H300.7c-10.4 36.9-44.4 64-84.7 64s-74.2-27.1-84.7-64H128c-35.3 0-64-28.7-64-64v-48H24c-13.3 0-24-10.7-24-24s10.7-24 24-24h112c13.3 0 24-10.7 24-24s-10.7-24-24-24H24c-13.3 0-24-10.7-24-24s10.7-24 24-24h176c13.3 0 24-10.7 24-24s-10.7-24-24-24H24c-13.3 0-24-10.7-24-24s10.7-24 24-24zm512 192v-50.7L530.7 192H480v96zM256 424a40 40 0 1 0-80 0 40 40 0 1 0 80 0m232 40a40 40 0 1 0 0-80 40 40 0 1 0 0 80"/></svg>';

const TEXT = {
  en:{ badge:TRUCK + ' <b>Fast</b>&nbsp;Delivery', search:"Search the menu…", empty:"No items found.",
       cTitle:"Order / Contact", cPhoneL:"Call for delivery", cAddrL:"Visit us",
       addr:"Opposite Crown Cinema, Street # 1, Garden Colony, Garjakh, Gujranwala",
       fab:"Call to Order",
       foot:"All prices in Pakistani Rupees (Rs.). Prices may change without notice.", rs:"Rs." },
  ur:{ badge:TRUCK + ' فاسٹ ڈیلیوری', search:"مینو میں تلاش کریں…", empty:"کوئی آئٹم نہیں ملا۔",
       cTitle:"آرڈر / رابطہ", cPhoneL:"ڈیلیوری کے لیے کال کریں", cAddrL:"ہمارا پتہ",
       addr:"کراؤن سینما کے سامنے، گلی نمبر 1، گارڈن کالونی، گرجاکھ، گوجرانوالہ",
       fab:"آرڈر کے لیے کال کریں",
       foot:"تمام قیمتیں پاکستانی روپے میں ہیں۔ قیمتیں بغیر اطلاع کے تبدیل ہو سکتی ہیں۔", rs:"Rs." }
};

let lang = "en";
const $ = id => document.getElementById(id);

function render(){
  const t = TEXT[lang], ur = lang === "ur";
  document.documentElement.lang = lang;
  document.documentElement.dir = ur ? "rtl" : "ltr";
  document.body.classList.toggle("ur", ur);
  $("badge").innerHTML = t.badge;
  $("q").placeholder = t.search;
  $("empty").textContent = t.empty;
  $("cTitle").textContent = t.cTitle;
  $("cPhoneL").textContent = t.cPhoneL;
  $("cAddrL").textContent = t.cAddrL;
  $("cAddr").textContent = t.addr;
  $("fabT").textContent = t.fab;
  $("foot").textContent = t.foot;
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));

  $("tabs").innerHTML = MENU.map(c =>
    `<a href="#${c.id}" data-id="${c.id}">${ico(c,"ti")}<span>${ur ? c.ur : c.en}</span></a>`).join("");

  $("menu").innerHTML = MENU.map(c => `
    <section id="${c.id}">
      <h2>${ico(c,"hi")}<span>${ur ? c.ur : c.en}</span></h2>
      <div class="list">${c.items.map(i => `
        <div class="item" data-s="${(i[0]+" "+i[1]).toLowerCase()}">
          <span class="name">${ur ? i[1] : i[0]}${(ur ? i[4] : i[3]) ? `<span class="note">${ur ? i[4] : i[3]}</span>` : ""}</span>
          <span class="price">${t.rs} ${i[2]}</span>
        </div>`).join("")}
      </div>
    </section>`).join("");

  filter();
  bindTabs();
  onScroll();
}

function filter(){
  const q = $("q").value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll("section").forEach(s => {
    let shown = 0;
    s.querySelectorAll(".item").forEach(it => {
      const ok = !q || it.dataset.s.includes(q);
      it.style.display = ok ? "" : "none";
      if (ok) shown++;
    });
    s.style.display = shown ? "" : "none";
    if (shown) any = true;
  });
  $("empty").style.display = any ? "none" : "block";
  onScroll();
}

/* ---------- Category navigation ----------
   Tapping a pill scrolls so the section heading sits just under the sticky bar.
   While scrolling, the pill of the section you're reading is highlighted. */
let navLock = false, lockTimer;

function navHeight(){ return document.querySelector("nav").offsetHeight; }

function setActive(id){
  const tabs = $("tabs");
  tabs.querySelectorAll("a").forEach(a => {
    const on = a.dataset.id === id;
    a.classList.toggle("on", on);
    if (on) {
      // scroll only the pill bar sideways (never the page) so the active pill is centred
      const ar = a.getBoundingClientRect(), tr = tabs.getBoundingClientRect();
      tabs.scrollBy({ left: (ar.left + ar.width / 2) - (tr.left + tr.width / 2), behavior: "smooth" });
    }
  });
}

function currentSection(){
  const secs = [...document.querySelectorAll("main section")].filter(s => s.style.display !== "none");
  if (!secs.length) return null;
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
    // at the very bottom: pick the last section that is visible on screen
    const vis = secs.filter(s => s.getBoundingClientRect().top < window.innerHeight - 120);
    return (vis[vis.length - 1] || secs[0]).id;
  }
  const line = navHeight() + 24;
  let cur = secs[0].id;
  secs.forEach(s => { if (s.getBoundingClientRect().top <= line) cur = s.id; });
  return cur;
}

function onScroll(){
  if (navLock) return;
  const id = currentSection();
  if (id) setActive(id);
}

function bindTabs(){
  $("tabs").querySelectorAll("a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const sec = document.getElementById(a.dataset.id);
    if (!sec) return;
    setActive(a.dataset.id);
    navLock = true;
    clearTimeout(lockTimer);
    const y = sec.getBoundingClientRect().top + window.scrollY - navHeight() + 6;
    window.scrollTo({ top: y, behavior: "smooth" });
    lockTimer = setTimeout(() => { navLock = false; }, 900);
  }));
}

window.addEventListener("scroll", onScroll, { passive: true });
$("tabs").addEventListener("wheel", e => {
  const t = $("tabs");
  if (t.scrollWidth > t.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    t.scrollLeft += (getComputedStyle(t).direction === "rtl" ? -1 : 1) * e.deltaY; e.preventDefault();
  }
}, { passive: false });
window.addEventListener("scrollend", () => { clearTimeout(lockTimer); navLock = false; });

function setLang(l){
  lang = l;
  try { localStorage.setItem("menuLang", l); } catch(e) {}
  render();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
$("q").addEventListener("input", filter);

/* Starting language: ?lang=ur in the link > last choice > English */
(function init(){
  let l = new URLSearchParams(location.search).get("lang");
  if (!l) { try { l = localStorage.getItem("menuLang"); } catch(e) {} }
  lang = (l === "ur") ? "ur" : "en";
  render();
})();
</script>
